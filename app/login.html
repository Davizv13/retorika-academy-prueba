<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión · Retorika</title>

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-brand">
                RETORIKA
            </div>

            <h1>Iniciar sesión</h1>

            <p>
                Accede a tu espacio de trabajo.
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

                <p id="loginMessage"></p>

            </form>

            <div class="auth-register">

                ¿No tienes cuenta?

                <a href="registro.html">
                    Crear cuenta
                </a>

            </div>

        </section>

    </main>

    <script src="../js/login.js"></script>

</body>

</html>
